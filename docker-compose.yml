services:
  probe-control-panel:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: probe-control-panel:latest
    container_name: probe-control-panel
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PANEL_PORT:-8184}:8080"
    volumes:
      - panel-data:/data

volumes:
  panel-data:
